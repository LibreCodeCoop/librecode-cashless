name: librecode-cashless-poc
services:
  postgres:
    image: docker.io/postgres:14-alpine
    restart: unless-stopped
    env_file:
      - .local/postgres.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stustapay -d stustapay"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
